name: Delta Force Daily Update

on:

  # Every day at 08:05 AM IST
  # 08:05 IST = 02:35 UTC
  schedule:
    - cron: "35 2 * * *"

  # Allows you to manually run it from GitHub
  workflow_dispatch:


jobs:

  update:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ================================================
      # Download repository
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ================================================
      # Setup Python
      # ================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ================================================
      # Install Python packages
      # ================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ================================================
      # Install Playwright Chromium
      # ================================================

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium


      # ================================================
      # Run collector
      # ================================================

      - name: Collect codes and generate image
        run: |
          python collector.py


      # ================================================
      # Commit changes
      # ================================================

      - name: Save updated files
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add codes.json final_youtube_square.png

          git diff --cached --quiet || git commit -m "Update daily Delta Force codes"

          git push